# MSA 微服务的容器编排入口。基础设施（PostgreSQL、Redis、RabbitMQ、OTel Collector）不在这里，
# 由外部的 dotnet-infra 项目提供，所有服务加入它的 dotnet-infra_backend 网络。
#
# 用法（在 docker/ 目录下）：
#   1. cp .env.example .env，按需修改基础设施地址与口令
#   2. ./scripts/new-openiddict-certs.ps1（或 .sh）生成认证中心与两个 BFF 的 OpenIddict 密钥证书，
#      随机口令写进 certs/cert-passwords.env（与 .env 一起插值）；按部署修改 config/ 下的结构化配置
#      服务不映射端口、只开 HTTP，对外由入口代理按域名终止 TLS 后转发
#   3. 镜像由 scripts/build-images.* 构建并推送到 Harbor，这里只拉取运行：
#      docker compose pull && docker compose up -d   # 全部
#      docker compose up -d msa-catalog             # 单个服务
# 详见 README.md。
name: msa

include:
  # 入口：网关与 BFF
  - path: services/edge/gateway.yaml
    env_file: [.env, certs/cert-passwords.env]
  - path: services/edge/bff-web.yaml
    env_file: [.env, certs/cert-passwords.env]
  - path: services/edge/bff-bm.yaml
    env_file: [.env, certs/cert-passwords.env]
  # 身份与用户
  - path: services/identity/identity.yaml
    env_file: [.env, certs/cert-passwords.env]
  - path: services/identity/user.yaml
    env_file: [.env, certs/cert-passwords.env]
  # 交易域
  - path: services/commerce/catalog.yaml
    env_file: [.env, certs/cert-passwords.env]
  - path: services/commerce/inventory.yaml
    env_file: [.env, certs/cert-passwords.env]
  - path: services/commerce/basket.yaml
    env_file: [.env, certs/cert-passwords.env]
  - path: services/commerce/order.yaml
    env_file: [.env, certs/cert-passwords.env]
  - path: services/commerce/payment.yaml
    env_file: [.env, certs/cert-passwords.env]
  # 平台服务
  - path: services/platform/notification.yaml
    env_file: [.env, certs/cert-passwords.env]
