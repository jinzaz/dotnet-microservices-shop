# Tempo 3.x 单进程（monolithic）配置。${VAR:-默认值} 由 -config.expand-env=true 展开（见 docker-compose.yml）。
server:
  http_listen_port: 3200
  log_level: warn

# 按容器的 cgroup 内存上限自动设置 Go 运行时的 GOMEMLIMIT（上限 × ratio）。
memory:
  automemlimit_enabled: true
  automemlimit_ratio: 0.8

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# 还没写进块的"正在进行"的链路放在内存里，默认上限 250MB，对 384MB 的容器太大。
live_store:
  max_live_traces_bytes: 50000000

storage:
  trace:
    backend: local

    wal:
      path: /var/tempo/wal

    local:
      path: /var/tempo/blocks

backend_worker:
  compaction:
    # 链路主要用来排查最近的问题，数据量又比指标、日志大得多，默认只留 3 天。
    block_retention: ${TEMPO_RETENTION:-72h}

usage_report:
  reporting_enabled: false
