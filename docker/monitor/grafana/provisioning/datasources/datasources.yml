apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # 指标上的 exemplar 带 trace_id（SDK TraceBased 过滤 + Collector OpenMetrics + Prometheus exemplar-storage），
      # 点延迟图上的 exemplar 点直接打开 Tempo。链路被尾部采样丢掉时同样打不开。
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # 从链路跳到这条链路的日志。日志经 OTLP 进 Loki：service.name 变成标签 service_name，
      # trace_id 存在结构化元数据里而不在日志正文中，所以用自定义查询按元数据过滤，不能用正文的 |= 搜索。
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: service.name
            value: service_name
        customQuery: true
        # 预置文件会展开 $VAR / ${VAR} 环境变量，Grafana 自己的模板变量要写成 $$ 转义。
        query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      # 从 span 跳到所在服务的 HTTP 指标。Tempo 没开 metrics_generator（没有 span 指标），所以写成 SDK 自带的
      # http_server_request_duration_seconds；Prometheus 抓 Collector 时 honor_labels，服务名在 job 标签上。
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: job
        queries:
          - name: 请求速率
            query: 'sum by (http_route) (rate(http_server_request_duration_seconds_count{$${__tags}, http_route!="/health"}[2m]))'
          - name: P95 延迟
            query: 'histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{$${__tags}, http_route!="/health"}[2m])))'
          - name: 5xx 错误率
            query: 'sum(rate(http_server_request_duration_seconds_count{$${__tags}, http_response_status_code=~"5.."}[2m])) / sum(rate(http_server_request_duration_seconds_count{$${__tags}}[2m]))'

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # 从日志跳到链路：结构化元数据 trace_id 生成一个打开 Tempo 的链接。
      # 链路被尾部采样丢掉时，这个链接会打不开（日志是全量的，链路只留错误、慢请求和一部分正常请求）。
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: 查看链路
