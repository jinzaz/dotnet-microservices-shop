global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

# 后续如需基础设施监控，可再追加 exporter：
