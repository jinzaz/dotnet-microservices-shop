# 订单与下单 Saga；下单时实时确认价格、券、库存与收货地址。
# 只在 dotnet-infra_backend 网络内访问（不映射端口）：容器名 msa-order，监听 8080（HTTP/1.1：REST、健康检查）与 8081（HTTP/2：gRPC）。
# 公共部分（环境、Issuer、OTLP、转发头、PostgreSQL / Redis / RabbitMQ 地址与口令）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-order:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-infra-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/order-service:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-order
    environment:
      ServiceAuthentication__ClientId: "MSA_Svc_Order"
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: "http://+:8081"
      Kestrel__Endpoints__Grpc__Protocols: Http2
      MSA_SERVICE_AUTHORITY: "${MSA_SERVICE_AUTHORITY}"
      MSA_CLIENT_SECRET_MSA_SVC_ORDER: "${MSA_CLIENT_SECRET_MSA_SVC_ORDER}"
      # 售后凭证（私有桶）：订单服务签发浏览器直传 / 读取地址，并回查对象是否已上传，所以同样要能访问这个公网地址。
      INFRA_OSS_ENDPOINT: "${INFRA_OSS_ENDPOINT}"
      INFRA_OSS_ACCESS_KEY: "${INFRA_OSS_ACCESS_KEY}"
      INFRA_OSS_SECRET_KEY: "${INFRA_OSS_SECRET_KEY}"
      INFRA_OSS_REGION: "${INFRA_OSS_REGION:-us-east-1}"
      INFRA_OSS_FORCE_PATH_STYLE: "${INFRA_OSS_FORCE_PATH_STYLE:-true}"
      INFRA_OSS_REFERER: "${INFRA_OSS_REFERER:-}"
    networks:
      - backend

networks:
  backend:
    name: dotnet-infra_backend
    external: true
