# 商品、促销、优惠券与抢券；对订单/购物车提供价格与券确认 gRPC。
# 域名：catalog.${MSA_DOMAIN}（容器之间也走这个名字，网络别名指向本容器）。
# 公共部分（TLS 证书、OTLP、Issuer、环境）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-catalog:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/catalog-service:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-catalog
    ports:
      - "10003:10003"
    environment:
      ASPNETCORE_URLS: "https://+:10003"
      ConnectionStrings__Postgresql: "Host=${INFRA_POSTGRES_HOST};Port=${INFRA_POSTGRES_PORT:-5432};Database=CatalogDb;Username=${INFRA_POSTGRES_USER};Password=${INFRA_POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "${INFRA_REDIS_HOST}:${INFRA_REDIS_PORT:-6379},password=${INFRA_REDIS_PASSWORD},defaultDatabase=2"
      RabbitMQ__HostName: "${INFRA_RABBITMQ_HOST}"
      RabbitMQ__Port: "${INFRA_RABBITMQ_PORT:-5672}"
      RabbitMQ__UserName: "${INFRA_RABBITMQ_USER}"
      RabbitMQ__Password: "${INFRA_RABBITMQ_PASSWORD}"
    networks:
      backend:
        aliases:
          - catalog.${MSA_DOMAIN}

networks:
  backend:
    name: dotnet-infra_backend
    external: true
