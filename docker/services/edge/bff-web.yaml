# 商城 BFF：浏览器会话、反向代理到网关、秒杀余量 SSE。浏览器用 https://localhost:10008 访问（会话 Cookie 需要安全上下文）。
# 域名：bff-web.${MSA_DOMAIN}（容器之间也走这个名字，网络别名指向本容器）。
# 公共部分（TLS 证书、OTLP、Issuer、环境）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-bff-web:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/bff-web:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-bff-web
    ports:
      - "10008:10008"
    environment:
      ASPNETCORE_URLS: "https://+:10008"
      ConnectionStrings__Postgresql: "Host=${INFRA_POSTGRES_HOST};Port=${INFRA_POSTGRES_PORT:-5432};Database=BFFDb;Username=${INFRA_POSTGRES_USER};Password=${INFRA_POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "${INFRA_REDIS_HOST}:${INFRA_REDIS_PORT:-6379},password=${INFRA_REDIS_PASSWORD},defaultDatabase=7"
      OpenIddict__Issuer: "${MSA_ISSUER}"
      ReverseProxy__Clusters__gateway__Destinations__default__Address: "https://gateway.${MSA_DOMAIN}:10000/"
      ServiceAuthentication__Authority: "https://identity.${MSA_DOMAIN}:10002/"
      GrpcClients__Inventory__Address: "https://inventory.${MSA_DOMAIN}:10004"
      Bff__FrontendBaseUrl: "${MSA_STORE_FRONTEND_URL}"
      MSA_OPENIDDICT_CERT_PATH: /certs/openiddict.pfx
      MSA_OPENIDDICT_CERT_PASSWORD: "${MSA_BFF_WEB_OPENIDDICT_CERT_PASSWORD}"
    volumes:
      - ../../certs/bff-web-openiddict.pfx:/certs/openiddict.pfx:ro
    networks:
      frontend:
        aliases:
          - bff-web.${MSA_DOMAIN}

networks:
  frontend:
    name: dotnet-infra_frontend
    external: true
