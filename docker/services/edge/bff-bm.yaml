# 后台 BFF：浏览器会话、PBAC、反向代理到网关、订单详情聚合。对外由入口代理以 HTTPS 暴露。
# 只在 dotnet-infra_backend 网络内访问（不映射端口）：容器名 msa-bff-bm，监听 8080（HTTP）。
# 公共部分（环境、Issuer、OTLP、转发头）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-bff-bm:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/bff-bm:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-bff-bm
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgresql: "Host=${INFRA_POSTGRES_HOST};Port=${INFRA_POSTGRES_PORT:-5432};Database=BFFDb;Username=${INFRA_POSTGRES_USER};Password=${INFRA_POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "${INFRA_REDIS_HOST}:${INFRA_REDIS_PORT:-6379},password=${INFRA_REDIS_PASSWORD},defaultDatabase=7"
      OpenIddict__Issuer: "${MSA_ISSUER}"
      Bff__FrontendBaseUrl: "${MSA_ADMIN_FRONTEND_URL}"
      ReverseProxy__Clusters__gateway__Destinations__default__Address: "http://msa-gateway:8080/"
      ServiceAuthentication__Authority: "${MSA_ISSUER}"
      GrpcClients__Order__Address: "http://msa-order:8081"
      GrpcClients__Payment__Address: "http://msa-payment:8081"
      GrpcClients__Inventory__Address: "http://msa-inventory:8081"
      MSA_OPENIDDICT_CERT_PATH: /certs/openiddict.pfx
      MSA_OPENIDDICT_CERT_PASSWORD: "${MSA_BFF_BM_OPENIDDICT_CERT_PASSWORD}"
    volumes:
      - ../../certs/bff-bm-openiddict.pfx:/certs/openiddict.pfx:ro
    networks:
      - backend

networks:
  backend:
    name: dotnet-infra_backend
    external: true
