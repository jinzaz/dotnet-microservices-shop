# 后台 BFF：浏览器会话、PBAC、反向代理到网关、订单详情聚合。对外由入口代理以 HTTPS 暴露。
# 只在 dotnet-infra_backend / dotnet-infra_frontend 网络内访问（不映射端口）：容器名 msa-bff-bm，监听 8080（HTTP）。
# 公共部分（环境、Issuer、OTLP、转发头、PostgreSQL / Redis / RabbitMQ 地址与口令）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-bff-bm:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-infra-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/bff-bm:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-bff-bm
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ServiceAuthentication__ClientId: "MSA_Svc_BffBm"
      OpenIddict__ClientId: "MSA_Bff_BM"
      OpenIddict__Issuer: "${MSA_ISSUER}"
      OpenIddict__InternalAddress: "${MSA_IDENTITY_INTERNAL_ADDRESS}"
      Bff__FrontendBaseUrl: "${MSA_ADMIN_FRONTEND_URL}"
      ReverseProxy__Clusters__gateway__Destinations__default__Address: "http://msa-gateway:8080/"
      MSA_SERVICE_AUTHORITY: "${MSA_SERVICE_AUTHORITY}"
      MSA_CLIENT_SECRET_MSA_BFF_BM: "${MSA_CLIENT_SECRET_MSA_BFF_BM}"
      MSA_CLIENT_SECRET_MSA_SVC_BFFBM: "${MSA_CLIENT_SECRET_MSA_SVC_BFFBM}"
      INFRA_OSS_ENDPOINT: "${INFRA_OSS_ENDPOINT}"
      INFRA_OSS_ACCESS_KEY: "${INFRA_OSS_ACCESS_KEY}"
      INFRA_OSS_SECRET_KEY: "${INFRA_OSS_SECRET_KEY}"
      # 证书库：私钥与 DataProtection 密钥环用自己的 KEK 解密。证书库里有当前证书时下面两个 pfx 不再使用（迁移期的退路）。
      MSA_CERT_KEK_BFF_BM: "${MSA_CERT_KEK_BFF_BM}"
      MSA_OPENIDDICT_CERT_PATH: /certs/openiddict.pfx
      MSA_OPENIDDICT_CERT_PASSWORD: "${MSA_BFF_BM_OPENIDDICT_CERT_PASSWORD}"
      # body 加密密钥，跟上面的 OpenIddict 证书是两套独立密钥（scripts/new-bodyenc-certs）。
      MSA_BODYENC_CERT_PATH: /certs/bodyenc.pfx
      MSA_BODYENC_CERT_PASSWORD: "${MSA_BFF_BM_BODYENC_CERT_PASSWORD}"
    volumes:
      - ../../certs/bff-bm-openiddict.pfx:/certs/openiddict.pfx:ro
      - ../../certs/bff-bm-bodyenc.pfx:/certs/bodyenc.pfx:ro
    networks:
      - backend
      - frontend

networks:
  frontend:
    name: dotnet-infra_frontend
    external: true
  backend:
    name: dotnet-infra_backend
    external: true
