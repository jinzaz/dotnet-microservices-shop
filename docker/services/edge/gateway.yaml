# API 网关（YARP）：BFF 的 /api/* 都经它转发到各业务服务。
# 只在 dotnet-infra_backend / dotnet-infra_frontend 网络内访问（不映射端口）：容器名 msa-gateway，监听 8080（HTTP）。
# 公共部分（环境、Issuer、OTLP、转发头）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-gateway:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/api-gateway:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-gateway
    mem_limit: ${MSA_MEM_LIMIT_LARGE:-448m}
    environment:
      ASPNETCORE_URLS: "http://+:8080"
    volumes:
      - ../../config/gateway/appsettings.json:/app/appsettings.${ASPNETCORE_ENVIRONMENT:-Production}.json:ro
    networks:
      - backend
      - frontend

networks:
  frontend:
    name: dotnet-infra_frontend
    external: true
  backend:
    name: dotnet-infra_backend
    external: true
