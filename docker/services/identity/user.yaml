# 用户资料、收货地址、积分；对订单提供地址查询 gRPC。
# 只在 dotnet-infra_backend 网络内访问（不映射端口）：容器名 msa-user，监听 8080（HTTP/1.1：REST、健康检查）与 8081（HTTP/2：gRPC）。
# 公共部分（环境、Issuer、OTLP、转发头）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-user:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/user-service:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-user
    environment:
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: "http://+:8081"
      Kestrel__Endpoints__Grpc__Protocols: Http2
      ConnectionStrings__Postgresql: "Host=${INFRA_POSTGRES_HOST};Port=${INFRA_POSTGRES_PORT:-5432};Database=UserDb;Username=${INFRA_POSTGRES_USER};Password=${INFRA_POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "${INFRA_REDIS_HOST}:${INFRA_REDIS_PORT:-6379},password=${INFRA_REDIS_PASSWORD},defaultDatabase=8"
      RabbitMQ__Host: "${INFRA_RABBITMQ_HOST}"
      RabbitMQ__Port: "${INFRA_RABBITMQ_PORT:-5672}"
      RabbitMQ__User: "${INFRA_RABBITMQ_USER}"
      RabbitMQ__Password: "${INFRA_RABBITMQ_PASSWORD}"
    networks:
      - backend

networks:
  backend:
    name: dotnet-infra_backend
    external: true
