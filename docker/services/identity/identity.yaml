# 认证中心（OpenIddict）。对外由入口代理以 HTTPS 暴露，令牌里的 iss = MSA_ISSUER。
# 只在 dotnet-infra_backend 网络内访问（不映射端口）：容器名 msa-identity，监听 8080（HTTP）。
# 公共部分（环境、Issuer、OTLP、转发头、PostgreSQL / Redis / RabbitMQ 地址与口令）在 base/dotnet-service.yaml；这里只写这个服务自己的东西。
services:
  msa-identity:
    extends:
      file: ../../base/dotnet-service.yaml
      service: dotnet-infra-service
    # 镜像由 scripts/build-images.* 构建并推送到 Harbor（清单见 images.txt），这里只拉取。
    image: ${MSA_IMAGE_REGISTRY:-harbor.local/msa-shop}/identity-service:${MSA_IMAGE_TAG:-latest}
    pull_policy: ${MSA_PULL_POLICY:-missing}
    container_name: msa-identity
    mem_limit: ${MSA_MEM_LIMIT_LARGE:-448m}
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      IdentityUi__BaseUrl: "${MSA_IDENTITY_UI_URL}"
      MSA_CLIENT_SECRET_MSA_BFF_WEB: "${MSA_CLIENT_SECRET_MSA_BFF_WEB}"
      MSA_CLIENT_SECRET_MSA_BFF_BM: "${MSA_CLIENT_SECRET_MSA_BFF_BM}"
      MSA_CLIENT_SECRET_MSA_SVC_ORDER: "${MSA_CLIENT_SECRET_MSA_SVC_ORDER}"
      MSA_CLIENT_SECRET_MSA_SVC_BASKET: "${MSA_CLIENT_SECRET_MSA_SVC_BASKET}"
      MSA_CLIENT_SECRET_MSA_SVC_PAYMENT: "${MSA_CLIENT_SECRET_MSA_SVC_PAYMENT}"
      MSA_CLIENT_SECRET_MSA_SVC_BFFWEB: "${MSA_CLIENT_SECRET_MSA_SVC_BFFWEB}"
      MSA_CLIENT_SECRET_MSA_SVC_BFFBM: "${MSA_CLIENT_SECRET_MSA_SVC_BFFBM}"
      MSA_CLIENT_SECRET_MSA_SVC_SEARCH: "${MSA_CLIENT_SECRET_MSA_SVC_SEARCH}"
      MSA_CLIENT_SECRET_MSA_AGENT_WEB: "${MSA_CLIENT_SECRET_MSA_AGENT_WEB}"
      # 证书库：私钥与 DataProtection 密钥环用自己的 KEK 解密。证书库里有当前证书时下面的 pfx 不再使用（迁移期的退路）。
      MSA_CERT_KEK_IDENTITY: "${MSA_CERT_KEK_IDENTITY}"
      MSA_OPENIDDICT_CERT_PATH: /certs/openiddict.pfx
      MSA_OPENIDDICT_CERT_PASSWORD: "${MSA_IDENTITY_OPENIDDICT_CERT_PASSWORD}"
      # 阿里云短信认证（Sms:Provider=aliyun 时必填，签名和模板在 config/identity/appsettings.json 的 Sms 节）。
      MSA_SMS_ALIYUN_ACCESS_KEY_ID: "${MSA_SMS_ALIYUN_ACCESS_KEY_ID:-}"
      MSA_SMS_ALIYUN_ACCESS_KEY_SECRET: "${MSA_SMS_ALIYUN_ACCESS_KEY_SECRET:-}"
    volumes:
      - ../../certs/identity-openiddict.pfx:/certs/openiddict.pfx:ro
      - ../../config/identity/appsettings.json:/app/appsettings.${ASPNETCORE_ENVIRONMENT:-Production}.json:ro
    networks:
      - backend

networks:
  backend:
    name: dotnet-infra_backend
    external: true
