# MSA 入口站点（nginx 配置，放进 nginx 的 conf.d/，不在 compose 里）。
#
#   shop.msa.test.com      商城前端 Front/dist      /api、/bff                       → msa-bff-web
#   admin.msa.test.com     后台前端 BM/dist         /api、/bff                       → msa-bff-bm
#   identity.msa.test.com  登录页   Identity/dist   /connect、/.well-known、/api/Auth → API 网关 → 认证中心
#   payment.msa.test.com   支付渠道回调             /payment/callbacks/               → msa-payment
#   oss.msa.test.com       对象存储                 全部                              → base-rustfs
#
# 静态页面由 nginx 直接提供。认证中心的请求经 API 网关（msa-gateway:8080）转发，网关按 Host 分发
# （docker/config/gateway/appsettings.json 里 edge-identity-* 路由）；网关里还有不限域名的内部服务路由，
# 所以认证中心的域名只放行上面三个前缀，不能从外部直接打到其他服务。
#
# 前提：
#   - nginx 容器加入 dotnet-infra_backend 网络（服务都不映射端口，用容器名访问），
#     并加网络别名 oss.msa.test.com：后台 BFF 用这个公网地址读写对象（INFRA_OSS_ENDPOINT）。
#     identity.msa.test.com 不需要了：校验令牌、取服务令牌都走 MSA_IDENTITY_INTERNAL_ADDRESS 直连容器，不经这里。
#   - 静态文件：各前端 npm run build 后，把 dist/ 内容放到下面的 root 目录。
#   - 证书路径按实际修改（这里假设一张 *.msa.test.com 通配符证书）。
#   - 下面 http 级别的 ssl_* 与 proxy_set_header 是这个 nginx 上所有站点的默认值；同一个 nginx 还有别的站点时，
#     把它们挪进各个 server 块。

# Docker 内置 DNS。各站点的后端地址写成变量（$upstream）在请求时解析：后端没起来时 nginx 也能启动，
# 容器重建换了 IP 也不用重启。变量里不带路径，请求路径原样转发。
resolver 127.0.0.11 valid=10s ipv6=off;

# 证书由证书服务（msa-certificate）维护：ACME 托管的站点到期前自动续订，新证书写到 MSA_TLS_DEPLOY_DIR/<站点名>/。
# 把那个目录只读挂到 nginx 的 /etc/nginx/certs，这里的 msa.test.com 就是后台"ACME 托管"里填的站点名。
# nginx 不会自己重新读证书：宿主机上加一条每天的定时任务（证书提前几周续订，每天一次足够）：
#   0 4 * * * docker exec <nginx 容器名> sh -c 'nginx -t && nginx -s reload'
ssl_certificate     /etc/nginx/certs/msa.test.com/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/msa.test.com/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;

# 网关与服务开了 ASPNETCORE_FORWARDEDHEADERS_ENABLED，靠 X-Forwarded-Proto 认出原始请求是 HTTPS：
# OpenIddict 只接受 HTTPS，BFF 的 Cookie 带 Secure，登录回调地址也按它生成。
# Host 原样转发：BFF 按它生成登录回调地址，网关按它分发，对象存储的 S3 签名也包含它。
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header Connection        "";

# 响应压缩：浏览器走的是公网，压缩划算；服务间调用在 Docker 网络内不经过这里，不用管。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# 未知域名直接断开，避免带任意 Host 的请求落到下面的站点
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name shop.msa.test.com admin.msa.test.com identity.msa.test.com payment.msa.test.com oss.msa.test.com;

    # Let's Encrypt HTTP-01 验证（只用于普通域名；通配符证书走 DNS-01，不经过这里）。证书服务按 token 返回 key authorization。
    location /.well-known/acme-challenge/ {
        set $acme http://msa-certificate:8080;
        proxy_pass $acme;
    }

    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------- 商城
server {
    listen 443 ssl;
    http2 on;
    server_name shop.msa.test.com;
    # 前端页面：src/MSA.Web/Front 执行 npm run build 后，把 dist/ 里的内容放到这个目录
    root /usr/share/nginx/html/msa/shop;
    set $upstream http://msa-bff-web:8080;

    # 秒杀余量 SSE：长连接，不能缓冲
    location /bff/flash-sales/ {
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /bff/ { proxy_pass $upstream; }
    location /api/ { proxy_pass $upstream; }

    # 前端路由（/cart、/orders/123 等）没有对应文件，回退到 index.html 交给 React Router
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}

# ---------------------------------------------------------------- 后台
server {
    listen 443 ssl;
    http2 on;
    server_name admin.msa.test.com;
    # 前端页面：src/MSA.Web/BM 执行 npm run build 后，把 dist/ 里的内容放到这个目录
    root /usr/share/nginx/html/msa/admin;
    set $upstream http://msa-bff-bm:8080;

    location /bff/ { proxy_pass $upstream; }
    location /api/ { proxy_pass $upstream; }

    # 前端路由（/cart、/orders/123 等）没有对应文件，回退到 index.html 交给 React Router
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}

# ---------------------------------------------------------------- 认证中心（登录页与 Issuer 同域：登录 Cookie 只属于这个域名）
server {
    listen 443 ssl;
    http2 on;
    server_name identity.msa.test.com;
    # 前端页面：src/MSA.Web/Identity 执行 npm run build 后，把 dist/ 里的内容放到这个目录
    root /usr/share/nginx/html/msa/identity;
    set $upstream http://msa-gateway:8080;

    location /connect/     { proxy_pass $upstream; }
    location /.well-known/ { proxy_pass $upstream; }
    location /api/Auth/    { proxy_pass $upstream; }

    # 前端路由（/cart、/orders/123 等）没有对应文件，回退到 index.html 交给 React Router
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}

# ---------------------------------------------------------------- 支付渠道回调（只放行回调前缀）
server {
    listen 443 ssl;
    http2 on;
    server_name payment.msa.test.com;
    set $upstream http://msa-payment:8080;

    location /payment/callbacks/ { proxy_pass $upstream; }
    location / { return 404; }
}

# ---------------------------------------------------------------- 对象存储
# 后台 BFF 签出的上传地址与商品图片地址都以 INFRA_OSS_ENDPOINT（https://oss.msa.test.com）开头，浏览器直接访问。
server {
    listen 443 ssl;
    http2 on;
    server_name oss.msa.test.com;
    set $upstream http://base-rustfs:9000;

    client_max_body_size 20m;   # 与后台 BFF 的上传上限一致（单个图片 20 MB）
    proxy_request_buffering off;

    location / { proxy_pass $upstream; }
}
