# 所有 .NET 服务的公共部分，各服务通过 extends 引用。
# 端点、各自的 OpenIddict 密钥与结构化配置写在各服务自己的文件里，这里只放所有服务都一样的部分。
services:
  dotnet-service:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # 服务只开明文 HTTP，TLS 在入口代理终止。打开转发头处理后，认证中心与 BFF 才能从 X-Forwarded-Proto
      # 认出原始请求是 HTTPS：OpenIddict 只接受 HTTPS、BFF 的会话 Cookie 带 Secure、登录回调地址也按它生成。
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # 浏览器跳转登录与各服务校验令牌（iss claim）用的是同一个公网地址（经入口代理）。
      Authentication__Issuer: ${MSA_ISSUER}
      # 校验令牌时拉 JWKS 走容器网络直连认证中心，不经入口代理绕一圈；浏览器不用这个地址，不受影响。
      Authentication__InternalAddress: ${MSA_IDENTITY_INTERNAL_ADDRESS}
      Database__MigrateOnStartup: ${MSA_MIGRATE_ON_STARTUP:-false}
      # 链路、指标、日志统一发往这个 OTLP（gRPC）端点（与 msa.env 同名，应用里合并进 OpenTelemetry:OtlpEndpoint）。
      MSA_OTLP_ENDPOINT: ${MSA_OTLP_ENDPOINT}

  # 用到 PostgreSQL / Redis / RabbitMQ 与 gRPC 下游的服务（除网关外的全部）。变量名与本地开发的 msa.env 相同，
  # 应用启动时由 MSA.Common.MsaEnvironment 合并进各自的连接串、RabbitMQ 与 GrpcClients 配置（库名、Redis 库号、队列名在镜像的 appsettings.json 里）。
  # 只有声明了对应 GrpcClients 的服务才会用到某个 MSA_GRPC_*。
  dotnet-infra-service:
    extends:
      service: dotnet-service
    environment:
      INFRA_POSTGRES_HOST: ${INFRA_POSTGRES_HOST}
      INFRA_POSTGRES_PORT: ${INFRA_POSTGRES_PORT:-5432}
      INFRA_POSTGRES_USER: ${INFRA_POSTGRES_USER}
      INFRA_POSTGRES_PASSWORD: ${INFRA_POSTGRES_PASSWORD}
      INFRA_REDIS_HOST: ${INFRA_REDIS_HOST}
      INFRA_REDIS_PORT: ${INFRA_REDIS_PORT:-6379}
      INFRA_REDIS_PASSWORD: ${INFRA_REDIS_PASSWORD}
      INFRA_RABBITMQ_HOST: ${INFRA_RABBITMQ_HOST}
      INFRA_RABBITMQ_PORT: ${INFRA_RABBITMQ_PORT:-5672}
      INFRA_RABBITMQ_USER: ${INFRA_RABBITMQ_USER}
      INFRA_RABBITMQ_PASSWORD: ${INFRA_RABBITMQ_PASSWORD}
      INFRA_RABBITMQ_VHOST: ${INFRA_RABBITMQ_VHOST}
      MSA_GRPC_ORDER_ADDRESS: ${MSA_GRPC_ORDER_ADDRESS}
      MSA_GRPC_CATALOG_ADDRESS: ${MSA_GRPC_CATALOG_ADDRESS}
      MSA_GRPC_INVENTORY_ADDRESS: ${MSA_GRPC_INVENTORY_ADDRESS}
      MSA_GRPC_PAYMENT_ADDRESS: ${MSA_GRPC_PAYMENT_ADDRESS}
      MSA_GRPC_USER_ADDRESS: ${MSA_GRPC_USER_ADDRESS}
